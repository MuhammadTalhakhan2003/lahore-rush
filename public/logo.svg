<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lahore Rush — a 125 rider racing past Minar-e-Pakistan and the Badshahi Masjid under a Mughal arch">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9d77e"/>
      <stop offset=".45" stop-color="#f0954a"/>
      <stop offset=".8" stop-color="#c2412b"/>
      <stop offset="1" stop-color="#7a1f1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe39a"/>
      <stop offset=".5" stop-color="#e0b04a"/>
      <stop offset="1" stop-color="#a8761f"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3242a"/>
      <stop offset="1" stop-color="#5a0d14"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset=".6" stop-color="#ffe19a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="arch">
      <path d="M128 420 V236 C128 170 190 128 256 66 C322 128 384 170 384 236 V420 Z"/>
    </clipPath>
  </defs>

  <!-- roundel -->
  <circle cx="256" cy="256" r="248" fill="#2a0a0e"/>
  <circle cx="256" cy="256" r="234" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#e0b04a" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"/>
  <g fill="#e0b04a">
    <circle cx="256" cy="34" r="5"/><circle cx="62" cy="200" r="4"/><circle cx="450" cy="200" r="4"/>
    <path d="M70 300 l8 -8 8 8 -8 8z"/><path d="M426 300 l8 -8 8 8 -8 8z"/>
  </g>

  <!-- the arch: sunset sky + Lahore skyline -->
  <g clip-path="url(#arch)">
    <rect x="120" y="60" width="272" height="370" fill="url(#sky)"/>
    <circle cx="256" cy="300" r="92" fill="url(#sun)"/>
    <!-- kite -->
    <g transform="translate(182 150) rotate(12)">
      <path d="M0 -20 L16 0 L0 22 L-16 0 Z" fill="#e91e63"/>
      <path d="M0 -20 L16 0 L0 0 Z" fill="#ffd60a"/>
      <path d="M0 22 q6 10 -2 18 q-6 8 2 16" fill="none" stroke="#0b6e3a" stroke-width="2.5"/>
    </g>
    <path d="M182 150 L118 60" stroke="#fff4cf" stroke-width="1" opacity=".7"/>
    <!-- Badshahi Masjid domes + minaret -->
    <g fill="#3a0d0d">
      <rect x="138" y="342" width="122" height="90"/>
      <ellipse cx="166" cy="344" rx="20" ry="24"/><ellipse cx="200" cy="333" rx="28" ry="33"/><ellipse cx="234" cy="344" rx="20" ry="24"/>
      <rect x="164.5" y="312" width="3" height="12"/><rect x="198.5" y="292" width="3" height="14"/><rect x="232.5" y="312" width="3" height="12"/>
      <rect x="140" y="276" width="11" height="150"/><path d="M137 280 h17 l-8.5 -14z"/>
    </g>
    <!-- Minar-e-Pakistan -->
    <g fill="#3a0d0d">
      <path d="M300 432 L346 432 L330 186 L316 186 Z"/>
      <rect x="306" y="250" width="34" height="6"/><rect x="310" y="300" width="30" height="5"/><rect x="301" y="352" width="44" height="6"/>
      <ellipse cx="323" cy="183" rx="11" ry="13"/><rect x="321.8" y="150" width="2.4" height="24"/>
      <path d="M282 432 Q300 392 323 392 Q346 392 364 432 Z"/>
    </g>
    <rect x="120" y="372" width="272" height="60" fill="#2a0a0e"/>
    <rect x="120" y="370" width="272" height="3" fill="#e0b04a" opacity=".55"/>
    <g transform="translate(0 -36)">
    <!-- speed lines -->
    <g stroke="#fbe39a" stroke-width="4" stroke-linecap="round" opacity=".9">
      <path d="M132 352 h46"/><path d="M128 370 h60"/><path d="M136 388 h40"/>
    </g>
    <!-- 125 + rider, racing right -->
    <g fill="#14050a" stroke="#14050a" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="214" cy="392" r="29" fill="none" stroke-width="9"/>
      <circle cx="326" cy="392" r="29" fill="none" stroke-width="9"/>
      <circle cx="214" cy="392" r="6"/><circle cx="326" cy="392" r="6"/>
      <path d="M326 392 L310 336" fill="none" stroke-width="7"/>
      <path d="M214 392 L250 380 L286 382" fill="none" stroke-width="7"/>
      <path d="M232 352 L262 342 L300 344 L314 356 L298 368 L242 368 Z" stroke-width="2"/>
      <rect x="252" y="364" width="38" height="24" rx="4"/>
      <path d="M244 384 L196 378" fill="none" stroke-width="6"/>
      <path d="M310 336 L298 330" fill="none" stroke-width="5"/>
      <!-- rider -->
      <path d="M262 346 L284 304" fill="none" stroke-width="24"/>
      <circle cx="292" cy="286" r="14"/>
      <path d="M286 308 L306 330" fill="none" stroke-width="9"/>
      <path d="M262 350 L292 360 L286 390" fill="none" stroke-width="12"/>
    </g>
    <circle cx="317" cy="344" r="6" fill="#fff1c0"/>
    <!-- green & white scarf flying behind -->
    <path d="M284 300 C258 292 236 302 206 290 C222 308 252 312 282 310 Z" fill="#0b6e3a"/>
    <path d="M206 290 C222 300 246 304 268 303" fill="none" stroke="#f6efe0" stroke-width="3"/>
    </g>
  </g>
  <!-- arch frame -->
  <path d="M128 420 V236 C128 170 190 128 256 66 C322 128 384 170 384 236 V420" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <path d="M140 420 V238 C140 178 198 140 256 82 C314 140 372 178 372 238 V420" fill="none" stroke="#f6efe0" stroke-width="1.5" opacity=".6"/>
  <circle cx="256" cy="58" r="7" fill="url(#gold)"/>

  <!-- 125 badge -->
  <g transform="translate(392 150)">
    <circle r="36" fill="url(#gold)" stroke="#2a0a0e" stroke-width="4"/>
    <circle r="28" fill="none" stroke="#7a1f1f" stroke-width="1.5"/>
    <text y="9" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="27" fill="#5a0d14">125</text>
  </g>

  <!-- ribbon -->
  <path d="M58 404 L96 404 L96 452 L58 452 L74 428 Z" fill="#5a0d14"/>
  <path d="M454 404 L416 404 L416 452 L454 452 L438 428 Z" fill="#5a0d14"/>
  <path d="M82 392 H430 V448 H82 Z" fill="url(#ribbon)" stroke="url(#gold)" stroke-width="4"/>
  <path d="M82 448 L96 460 L96 448 Z M430 448 L416 460 L416 448 Z" fill="#3a0809"/>
  <text x="256" y="433" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="38" letter-spacing="2" fill="url(#gold)" stroke="#2a0a0e" stroke-width="1">LAHORE RUSH</text>
</svg>
